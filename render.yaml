# ==============================================================================
# BLUEPRINT OFICIAL RENDER.COM - SISTEMA GOVTECH NLLC
# Deploy 100% automatizado, gratuito e sem necessidade de cartão de crédito.
# ==============================================================================
services:
  - type: web
    name: govtech-nllc
    runtime: docker
    plan: free
    region: ohio
    branch: main
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: 8080
      - key: PYTHONUNBUFFERED
        value: 1
    healthCheckPath: /api/v1/health
